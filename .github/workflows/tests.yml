name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * *" # daily, catches breakage in the sites under test
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run API tests
        run: pytest -m api --alluredir=allure-results --html=reports/api-report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: allure-results/

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests
        run: >
          pytest -m ui -n 4
          --browser ${{ matrix.browser }}
          --tracing retain-on-failure
          --screenshot only-on-failure
          --alluredir=allure-results
          --html=reports/ui-${{ matrix.browser }}.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report-${{ matrix.browser }}
          path: |
            reports/
            test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/

  # Merges the API job and both browser jobs into one Allure report.
  allure-report:
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate report
        run: npx --yes allure-commandline@2.46.2 generate allure-results --clean --single-file -o allure-report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
